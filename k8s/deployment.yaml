apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-portfolio
  template:
    metadata:
      labels:
        app: student-portfolio
    spec:
      containers:
        - name: student-portfolio
          image: vigneshb2006/student-portfolio:latest
          ports:
            - containerPort: 80
